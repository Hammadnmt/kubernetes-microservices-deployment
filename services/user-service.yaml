# ===================================================================
# User Service: Manages user authentication and profile data
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deploy
  labels:
    app: user-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        tier: backend
    spec:
      containers:
      - name: user-api
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=User Service v1 - Handling Authentication & Profiles"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
  - port: 80
    targetPort: 8080
